{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">{% if product %}ویرایش محصول{% else %}افزودن محصول جدید{% endif %}</h2>

<form method="post" enctype="multipart/form-data" class="col-md-6">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">نام محصول</label>
        <input type="text" name="name" class="form-control" value="{{ product.name|default:'' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">دسته‌بندی</label>
        <select name="category" class="form-select">
            <option value="">— انتخاب کنید —</option>
            {% for category in categories %}
            <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">برند</label>
        <select name="brand" class="form-select">
            <option value="">— انتخاب کنید —</option>
            {% for brand in brands %}
            <option value="{{ brand.id }}" {% if product.brand_id == brand.id %}selected{% endif %}>{{ brand.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">قیمت (تومان)</label>
        <input type="number" name="price" class="form-control" value="{{ product.price|default:'' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">موجودی</label>
        <input type="number" name="stock" class="form-control" value="{{ product.stock|default:0 }}">
    </div>

    <div class="mb-3">
        <label class="form-label">تصویر</label>
        <input type="file" name="image" class="form-control">
        {% if product.image %}
        <img src="{{ product.image.url }}" width="100" class="mt-2 rounded">
        {% endif %}
    </div>

    <div class="mb-3">
        <label class="form-label">توضیحات</label>
        <textarea name="description" class="form-control" rows="4">{{ product.description|default:'' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">ذخیره</button>
</form>

{% endblock %}
