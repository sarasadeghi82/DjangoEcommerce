{% extends 'base.html' %}

{% block content %}

<div class="row">
    <div class="col-md-3 mb-4">
        <div class="list-group">
            <a href="{% url 'accounts:profile' %}" class="list-group-item list-group-item-action">اطلاعات حساب من</a>
            <a href="{% url 'orders:my_orders' %}" class="list-group-item list-group-item-action">سفارش‌های من</a>
            <a href="{% url 'accounts:change_password' %}" class="list-group-item list-group-item-action active">تغییر رمز</a>
            <a href="{% url 'accounts:logout' %}" class="list-group-item list-group-item-action text-danger">خروج</a>
        </div>
    </div>

    <div class="col-md-9">
        <h2 class="mb-4">تغییر رمز عبور</h2>

        <form method="post" class="col-md-8">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">تغییر رمز</button>
        </form>
    </div>
</div>

{% endblock %}
